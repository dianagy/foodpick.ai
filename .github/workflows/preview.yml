# Manually-triggered preview deploy.
#
# Run it from the Actions tab ("Preview" → "Run workflow"), or with the CLI:
#   gh workflow run preview.yml --ref <branch>
#
# It runs the pipeline test first, then publishes the app to GitHub Pages and
# prints the URL in the job summary. Deliberately dispatch-only: nothing
# deploys on its own.
#
# One-time setup: Settings → Pages → Source = "GitHub Actions".
name: Preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run supersede one already in flight, but never cancel a deploy
# that is midway through publishing.
concurrency:
  group: preview
  cancel-in-progress: false

jobs:
  test:
    name: Pipeline sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run filter-pipeline sweep
        run: node tests/pipeline.test.mjs

      - name: Run craving-analysis sweep
        run: node tests/craving-analysis.test.mjs

      - name: Check dish photo URLs are live
        # Informational, not a deploy gate -- a broken photo URL already
        # falls back to the dish's emoji in the app, so one bad link
        # shouldn't hold back every other working one. Check this step's
        # own outcome (not just the job's) to see if any URLs need fixing.
        continue-on-error: true
        run: node tests/dish-photos.test.mjs

  deploy:
    name: Deploy to Pages
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate the no-image variant
        # foodpick-ai.html is the only source of truth in git; the no-photo
        # fallback is derived from it here rather than hand-maintained as a
        # second committed file that can drift.
        run: node scripts/build-no-image.mjs

      - name: Stage the site
        # Two variants, two URLs, one deploy: the default (with-photo) app at
        # the root, and the no-photo fallback under /no-image/. Pages serves
        # index.html at each path, so copy rather than move — keeping the
        # original filenames working as direct links too. manifest.webmanifest,
        # icons/, and sw.js are duplicated into both directories (not just the
        # root) since GitHub Pages project pages aren't served from the domain
        # root, so a relative link/fetch from /no-image/ needs its own copy
        # alongside it rather than a root-absolute path.
        run: |
          mkdir -p _site/no-image
          cp foodpick-ai.html _site/index.html
          cp foodpick-ai.html _site/foodpick-ai.html
          cp foodpick-ai-no-image.html _site/no-image/index.html
          cp foodpick-ai-no-image.html _site/foodpick-ai-no-image.html
          cp manifest.webmanifest sw.js _site/
          cp manifest.webmanifest sw.js _site/no-image/
          cp -r icons _site/icons
          cp -r icons _site/no-image/icons

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Report the URLs
        run: |
          {
            echo "### Preview deployed"
            echo
            echo "- With photo (default): <${{ steps.deploy.outputs.page_url }}>"
            echo "- No photo (fallback): <${{ steps.deploy.outputs.page_url }}no-image/>"
            echo
            echo "Built from \`${{ github.ref_name }}\` @ \`${{ github.sha }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
